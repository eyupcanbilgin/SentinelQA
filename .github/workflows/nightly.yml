name: Nightly Deep Quality Regression

on:
  schedule:
    - cron: '0 2 * * *' # 02:00 UTC daily
  workflow_dispatch:
  pull_request:

jobs:
  nightly-regression:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Start Evidence Run Manifest
        run: npm run quality:start-run

      - name: Verify Quality Catalog Consistency
        run: npm run catalog:verify

      - name: Run Backend Unit Tests
        run: node scripts/maven.mjs test

      - name: Run Quality Intelligence & Gate Unit Tests
        run: npm run test:unit

      - name: Run PIT Mutation Testing
        run: npm run mutation

      - name: Run Integration, API & Security Tests (PostgreSQL Testcontainers)
        run: node scripts/maven.mjs -Pintegration verify

      - name: Start Application Platform Stack
        run: npm run up

      - name: Install Playwright Chromium Browser
        run: npx playwright install --with-deps chromium

      - name: Run Critical Playwright E2E Regression
        run: npm run test:e2e

      - name: Run Reference k6 Performance Smoke Test
        run: npm run perf:smoke

      - name: Run Agent Evaluations on Development Dataset
        run: npm run agent-evals

      - name: Run Independent Holdout Benchmark
        run: npm run agent-evals:holdout

      - name: Run Change-Impact Test Selection Benchmark
        run: npm run quality:benchmark-selection

      - name: Run Guarded Healer Safety Benchmark
        run: npm run quality:benchmark-healer

      - name: Evaluate Nightly Quality Gate
        run: npm run quality:gate -- --profile nightly

      - name: Publish Step Summary
        if: always()
        run: |
          if [ -f reports/quality-gate.md ]; then
            cat reports/quality-gate.md >> $GITHUB_STEP_SUMMARY
          fi

      - name: Upload Nightly Reports & Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nightly-quality-reports
          path: |
            reports/
            backend/target/surefire-reports/
            backend/target/failsafe-reports/
            backend/target/pit-reports/
          retention-days: 14

name: Pull Request Quality Gate

on:
  pull_request:
    branches: [master, main]

jobs:
  verify-pr:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Start Evidence Run Manifest
        run: npm run quality:start-run

      - name: Verify Quality Catalog Consistency
        run: npm run catalog:verify

      - name: Compile Backend & Run Unit Tests
        run: node scripts/maven.mjs test

      - name: Build Frontend
        run: npm run build --workspace frontend

      - name: Run Quality Intelligence & Gate Unit Tests
        run: npm run test:unit

      - name: Analyze Change Risk & Generate Test Plan
        run: npm run quality:select-tests

      - name: Run Integration, API & Security Tests (PostgreSQL Testcontainers)
        run: node scripts/maven.mjs -Pintegration verify

      - name: Start Application Platform Stack
        run: npm run up

      - name: Install Playwright Chromium Browser
        run: npx playwright install --with-deps chromium

      - name: Run Critical Playwright E2E Journeys
        run: npm run test:e2e

      - name: Run Deterministic Agent & Rule-Baseline Evaluation
        run: npm run agent-evals

      - name: Evaluate PR Quality Gate
        run: npm run quality:gate -- --profile pr

      - name: Upload Quality Reports & Failure Evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pr-quality-reports
          path: |
            reports/
            backend/target/surefire-reports/
            backend/target/failsafe-reports/
          retention-days: 7

name: Release Quality Gate Audit

on:
  workflow_dispatch:
    inputs:
      release_version:
        description: 'Release version candidate (e.g. 1.0.0)'
        required: true
        default: '1.0.0'

jobs:
  audit-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Start Evidence Run Manifest
        run: npm run quality:start-run

      - name: Verify Quality Catalog Consistency
        run: npm run catalog:verify

      - name: Run Backend Unit Tests
        run: node scripts/maven.mjs test

      - name: Run Quality Tooling Unit Tests
        run: npm run test:unit

      - name: Run PIT Mutation Testing
        run: npm run mutation

      - name: Run Integration, API & Security Tests (PostgreSQL Testcontainers)
        run: node scripts/maven.mjs -Pintegration verify

      - name: Start Application Platform Stack
        run: npm run up

      - name: Install Playwright Chromium Browser
        run: npx playwright install --with-deps chromium

      - name: Run Critical Playwright E2E Regression
        run: npm run test:e2e

      - name: Run Reference k6 Performance Smoke Test
        run: npm run perf:smoke

      - name: Run Agent Evaluations
        run: npm run agent-evals

      - name: Run Quality Gate Aggregator (Release Profile)
        run: npm run quality:gate -- --profile release

      - name: Publish Release Decision Summary
        if: always()
        run: |
          if [ -f reports/quality-gate.md ]; then
            cat reports/quality-gate.md >> $GITHUB_STEP_SUMMARY
          fi

      - name: Upload Release Audit Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-audit-evidence
          path: |
            reports/
            backend/target/surefire-reports/
            backend/target/failsafe-reports/
            backend/target/pit-reports/
          retention-days: 30

  nightly:
    required: [unit, integration, security, e2e, performance, mutation, agentEvals]
  release:
    required: [unit, integration, security, e2e, performance, mutation, agentEvals]
criticalSecurityIds: [SEC-AUTHZ-001, SEC-AUTHZ-002, SEC-AUTHZ-003, SEC-AUTHZ-004]
